name: CI

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        python-version: [ '3.8', '3.11', '3.12', '3.13', '3.14', '3.15' ]
    steps:
      - uses: actions/checkout@v3
      - name: Cache test fixtures
        id: cache-test-fixtures
        uses: actions/cache@v3
        with:
          path: ${{ github.workspace }}/tests/fixtures/wannier90-*
          key: ${{ runner.os }}-${{ hashFiles('tests/fixtures/*') }}_0
      - uses: actions/setup-python@v3
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        # Unpinned: pip picks the newest releases that support each Python version
        run: |
          pip install . pytest pytest-cov pytest-codeblocks
      - name: Make fixtures
        if: steps.cache-test-fixtures.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y gfortran libblas-dev liblapack-dev
          make -C ./tests/fixtures
      - name: Run tests
        run: |
          pytest -v

  docs:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v3
        with:
          python-version: '3.13'
      - name: Install dependencies
        run: |
          pip install -r requirements/dev-requirements.txt
          pip install .
      - name: Build docs
        run: |
          mkdocs build
      - name: Publish docs
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site/
          force_orphan: true
